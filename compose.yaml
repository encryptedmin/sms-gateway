x-backend-env: &backend-env
  REDIS_URL: redis://redis:6379/0
  SMS_SITE_HOST: ${SMS_SITE_HOST:-sms.ite}
  DJANGO_ALLOWED_HOSTS: ${SMS_SITE_HOST:-sms.ite},127.0.0.1,localhost,backend
  CORS_ALLOWED_ORIGINS: http://${SMS_SITE_HOST:-sms.ite}
  CSRF_TRUSTED_ORIGINS: http://${SMS_SITE_HOST:-sms.ite}
  BROWSER_SESSION_CLOSE_GRACE_SECONDS: ${BROWSER_SESSION_CLOSE_GRACE_SECONDS:-2}

x-backend: &backend
  build: ./gateway-backend
  restart: unless-stopped
  volumes:
    - backend-data:/data

services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    <<: *backend
    environment:
      <<: *backend-env
      RUN_MIGRATIONS: "1"
      SEED_DATA: ${SEED_DATA:-1}
    depends_on:
      redis:
        condition: service_healthy

  worker:
    <<: *backend
    command: celery -A core worker --pool=threads --concurrency=2 -l info
    environment:
      <<: *backend-env
    depends_on:
      backend:
        condition: service_started
      redis:
        condition: service_healthy

  frontend:
    build: ./frontend
    restart: unless-stopped
    ports:
      - "${SMS_SITE_PORT:-80}:80"
    depends_on:
      - backend

  # Standalone messaging app that sends SMS through the gateway API.
  messenger:
    image: python:3.13-slim
    restart: unless-stopped
    working_dir: /app
    command: python server.py
    environment:
      GATEWAY_URL: http://backend:8000
      MESSENGER_DB: /data/messenger.db
    volumes:
      - ./messenger:/app:ro
      - messenger-data:/data
    ports:
      - "${MESSENGER_PORT:-8090}:8090"
    depends_on:
      - backend

volumes:
  redis-data:
  backend-data:
  messenger-data:
